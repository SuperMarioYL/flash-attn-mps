name: distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python benchmarks/check_distribution.py dist
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps dist/*.whl
      - name: Import the installed distribution outside the checkout
        working-directory: /tmp
        run: |
          python - <<'PY'
          import torch
          import flash_attn_mps
          import flash_attn_mps.vllm
          print(flash_attn_mps.__file__)
          print('MPS runtime available:', torch.backends.mps.is_available())
          print('This job validates distribution/install only; GPU correctness is measured separately.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
